name: validate
on:
  pull_request:
  push:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g @anthropic-ai/claude-code
      - name: マーケットプレイスと各プラグインの形を確かめる
        run: |
          claude plugin validate .
          for p in plugins/*/; do claude plugin validate "$p"; done
      - name: 事業データらしき文字列が入っていないか確かめる
        run: |
          if grep -rnE '[0-9]{3,4}-[0-9]{2,4}-[0-9]{4}|notion\.so/[0-9a-f]{32}|app\.notion\.com/p/[0-9a-f]{32}|[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[a-z]{2,}' plugins/; then
            echo "電話番号・NotionのURL・メールアドレスらしき文字列があります。実データでないか確かめてください"; exit 1
          fi
