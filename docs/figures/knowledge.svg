<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 330" width="680" height="330"><style>
:root{--bg:#fff;--ink:#1f2328;--sub:#57606a;--line:#d0d7de;--soft:#f6f8fa;--a:#0969da;--a-bg:#ddf4ff;--ok:#1a7f37;--ok-bg:#dafbe1;--warn:#cf222e;--warn-bg:#ffebe9;--o:#9a6700;--o-bg:#fff8c5;--p:#8250df;--p-bg:#fbefff}
@media (prefers-color-scheme:dark){:root{--bg:#191919;--ink:#e6edf3;--sub:#9da7b3;--line:#3d444d;--soft:#24282e;--a:#8cc8ff;--a-bg:#12324f;--ok:#7ee2a8;--ok-bg:#123d27;--warn:#ffa198;--warn-bg:#4a1d1c;--o:#f2cc60;--o-bg:#3d3110;--p:#d2a8ff;--p-bg:#33204f}}
*{box-sizing:border-box}



text{fill:var(--ink);font-family:-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif}
.t{font-size:14px;font-weight:700}.s{font-size:12.5px;fill:var(--sub)}.lab{font-size:12.5px;font-weight:700}
.zone-ok{fill:var(--ok-bg);stroke:var(--ok);stroke-width:2}
.box{fill:var(--bg);stroke:var(--line);stroke-width:1.5}
.home{fill:var(--soft);stroke:var(--warn);stroke-width:2;stroke-dasharray:6 4}
.a{stroke:var(--a);stroke-width:2.5;fill:none}.o{stroke:var(--o);stroke-width:2.5;fill:none}.p{stroke:var(--p);stroke-width:2.5;fill:none}.g{stroke:var(--sub);stroke-width:1.8;fill:none}
.ta{fill:var(--a)}.to{fill:var(--o)}.tp{fill:var(--p)}.tw{fill:var(--warn)}.tok{fill:var(--ok)}
 .bgrect{fill:var(--bg)}</style><rect class="bgrect" width="100%" height="100%"/>
<defs>
 <marker id="mg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" class="tok"/></marker>
 <marker id="mp" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" class="tp"/></marker>
</defs>
<rect x="300" y="10" width="372" height="310" rx="12" fill="var(--a-bg)" stroke="var(--a)" stroke-width="2"/>
<text x="316" y="36" class="t ta">知識用のNotion</text>
<text x="316" y="56" class="s">有料はコモンズ用の1人だけ、参加者はゲスト</text>
<rect x="316" y="72" width="140" height="62" rx="8" class="box"/><text x="330" y="98" class="t">参考文献</text><text x="330" y="120" class="s">論文・本・指針</text>
<rect x="516" y="72" width="140" height="62" rx="8" class="box"/><text x="530" y="98" class="t">個別の知識</text><text x="530" y="120" class="s">資材・病害虫など</text>
<line x1="458" y1="103" x2="514" y2="103" stroke="var(--a)" stroke-width="2"/><text x="486" y="96" text-anchor="middle" class="lab ta">出典</text>
<rect x="316" y="150" width="70" height="26" rx="13" fill="var(--o-bg)" stroke="var(--o)"/><text x="351" y="168" text-anchor="middle" class="lab to">下書き</text>
<text x="396" y="168" class="s">→ 毎晩AIが出典と照合 →</text>
<rect x="566" y="150" width="90" height="26" rx="13" fill="var(--ok-bg)" stroke="var(--ok)"/><text x="611" y="168" text-anchor="middle" class="lab tok">確認済み</text>
<rect x="316" y="200" width="340" height="104" rx="9" fill="var(--o-bg)" stroke="var(--o)" stroke-width="2" stroke-dasharray="6 4"/>
<text x="330" y="224" class="t to">入口（自前のMCPサーバー）</text>
<text x="330" y="246" class="s">出典が無いと書けない／書いたAIを記録</text>
<text x="330" y="266" class="s">AIが書いたものは「下書き」で入る</text>
<text x="330" y="286" class="s">事業データらしきものは受け付けない</text>

<rect x="8" y="72" width="200" height="62" rx="9" fill="var(--ok-bg)" stroke="var(--ok)" stroke-width="1.5"/>
<text x="22" y="98" class="t tok">人（参加者）</text><text x="22" y="120" class="s">Notionの画面で</text>
<line x1="210" y1="103" x2="312" y2="103" class="g" style="stroke:var(--ok)" marker-end="url(#mg)"/>
<text x="216" y="94" class="s">直接読み書き</text>

<rect x="8" y="220" width="200" height="62" rx="9" fill="var(--p-bg)" stroke="var(--p)" stroke-width="1.5"/>
<text x="22" y="246" class="t tp">各自のClaude</text><text x="22" y="268" class="s">入口をコネクタに追加</text>
<line x1="210" y1="251" x2="312" y2="251" class="p" marker-end="url(#mp)"/>
<path d="M486,198 L486,180" class="p" marker-end="url(#mp)"/>
<text x="214" y="240" class="s">ルールを通る</text>
</svg>